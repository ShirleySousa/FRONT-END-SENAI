<!DOCTYPE html>
<html>
<head>
<title>Calculadora e Identificador de Faixa Etária</title>
</head>
<body>

  <h1>Calculadora</h1>
  <input type="number" id="num1" placeholder="Número 1"> 
  <input type="number" id="num2" placeholder="Número 2"> 
  <select id="operacao"> 
    <option value="add">+</option> 
    <option value="sub">-</option> 
    <option value="mult">*</option> 
    <option value="div">/</option> 
  </select> 
  <button onclick="calcular()">Calcular</button> 
  <p id="resultado"></p> 

  <h1>Identificador de Faixa Etária</h1>
  <input type="number" id="idade" placeholder="Digite a idade">
  <button onclick="identificarFaixaEtaria()">Identificar</button>
  <p id="faixaEtaria"></p>

  <script>
    function calcular() {
      const num1 = parseFloat(document.getElementById('num1').value);
      const num2 = parseFloat(document.getElementById('num2').value);
      const operacao = document.getElementById('operacao').value;
      let resultado;

      switch (operacao) {
        case 'add':
          resultado = num1 + num2;
          break;
        case 'sub':
          resultado = num1 - num2;
          break;
        case 'mult':
          resultado = num1 * num2;
          break;
        case 'div':
          resultado = num1 / num2;
          break;
        default:
          resultado = 'Operação inválida';
      }

      document.getElementById('resultado').innerText = `Resultado: ${resultado}`;
    }

    function identificarFaixaEtaria() {
      const idade = parseInt(document.getElementById('idade').value);
      let faixa = '';

      if (idade >= 0 && idade < 15) {
        faixa = 'Criança';
      } else if (idade >= 15 && idade < 30) {
        faixa = 'Jovem';
      } else if (idade >= 30 && idade < 60) {
        faixa = 'Adulto';
      } else if (idade >= 60) {
        faixa = 'Idoso';
      } else {
        faixa = 'Idade inválida';
      }

      document.getElementById('faixaEtaria').innerText = `Faixa Etária: ${faixa}`;
    }
  </script>

</body>
</html>
